<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c0f0e">
<title>MIFTAH — Arabe depuis zéro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#0c0f0e; --bg2:#111615; --card:#151d1b; --card2:#1c2624;
  --line:#26332f; --txt:#e9efec; --muted:#87968f; --dim:#5a6b64;
  --accent:#d4a24c; --accent2:#c07f2e; --good:#4ec97e; --bad:#e5675d; --blue:#5b9bd5;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(900px 500px at 50% -180px,#1b2a26 0,transparent 60%),var(--bg);
  color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
.wrap{max-width:620px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
.hidden{display:none!important}
.ar{font-family:"Geeza Pro","Al Bayan","Noto Naskh Arabic","Times New Roman",serif;direction:rtl;unicode-bidi:isolate}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px;max-width:620px;margin:0 auto}
.logo{font-size:27px;font-weight:900;letter-spacing:-.03em;
  background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.06em;-webkit-text-fill-color:var(--muted);display:block;margin-top:-3px}
.stats{display:flex;gap:7px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:5px 9px;font-size:12px;font-weight:700}
.chip .k{color:var(--muted);font-weight:600;font-size:10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:13px}
.card h2{font-size:17px;margin-bottom:3px}
.sub{color:var(--muted);font-size:13px}
.mt{margin-top:12px}.mb{margin-bottom:12px}.center{text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.tile{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:15px;margin-bottom:11px;width:100%;text-align:left}
.tile:active{transform:scale(.99)}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:0 0 auto;
  background:linear-gradient(135deg,#d4a24c26,#d4a24c0d);color:var(--accent)}
.tile .body{flex:1;min-width:0}
.tile .t{font-weight:800;font-size:15px}
.tile .d{color:var(--muted);font-size:12.5px}
.tile .badge{background:var(--accent);color:#241a06;font-weight:800;font-size:12px;border-radius:20px;padding:3px 9px}
.tile .badge.zero{background:var(--card2);color:var(--muted)}

.btn{display:block;width:100%;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#241a06;
  font-weight:800;font-size:15px;padding:14px;border-radius:13px;text-align:center;margin-top:7px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-weight:700}
.btn:disabled{opacity:.4}

.pbar{height:6px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:8px}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px;transition:width .5s}

/* Sons */
.sonrow{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;margin-bottom:9px;width:100%;text-align:left}
.sonrow .glyph{font-size:34px;width:48px;text-align:center;color:var(--accent);flex:0 0 auto}
.sonrow .info{flex:1;min-width:0}
.sonrow .nm{font-weight:800;font-size:15px}
.sonrow .sm{color:var(--muted);font-size:12px}
.sonrow .pal{font-size:12px;font-weight:800;color:var(--dim)}
.sonrow .pal.on{color:var(--accent)}
.sonrow.ok{border-color:#4ec97e55}
.sonrow.ok .pal{color:var(--good)}
.deja{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;
  background:#4ec97e1a;color:var(--good);margin-bottom:6px}
.deja.no{background:#e5675d1a;color:var(--bad)}
.glyphbig{font-size:88px;text-align:center;color:var(--accent);line-height:1.1;margin:6px 0}
.expl{background:var(--bg2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;margin-top:10px}
.expl.warn{border-color:var(--bad)}
.wordcard{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:14px;text-align:center;margin-top:12px}
.wordcard .w{font-size:30px;font-weight:700}
.wordcard .t{font-size:15px;color:var(--accent);font-weight:800;margin-top:4px}
.wordcard .f{color:var(--muted);font-size:13px}

.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);
  border-radius:12px;padding:14px;margin-bottom:9px;font-size:15px;font-weight:600}
.opt.good{border-color:var(--good);background:#4ec97e14}
.opt.bad{border-color:var(--bad);background:#e5675d14}
.opt.dim{opacity:.45}
.opt[disabled]{cursor:default}

.spk{background:none;border:1px solid var(--line);border-radius:50%;width:58px;height:58px;font-size:24px;
  display:grid;place-items:center;margin:10px auto}
.spk.sm{width:32px;height:32px;font-size:15px;border-radius:9px;margin:0;display:inline-grid;vertical-align:middle}

/* Flashcard */
.flash{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;
  min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.flash .theme{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:800;margin-bottom:12px}
.flash .front{font-size:29px;font-weight:800}
.flash .arw{font-size:34px;margin-top:8px;color:var(--muted)}
.flash .back{font-size:21px;font-weight:700;color:var(--accent);margin-top:12px}
.flash .tap{color:var(--dim);font-size:12px;margin-top:14px}
.srsrow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.srsrow button{padding:11px 3px;border-radius:11px;font-weight:800;font-size:12.5px;border:1px solid var(--line);background:var(--card2)}
.srsrow .again{color:var(--bad)}.srsrow .hard{color:var(--accent)}.srsrow .good{color:var(--blue)}.srsrow .easy{color:var(--good)}
.srsrow button small{display:block;font-size:9px;color:var(--muted);font-weight:600;margin-top:2px}

/* Alphabet */
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acell{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px 4px;text-align:center}
.acell .g{font-size:27px;color:var(--accent)}
.acell .n{font-size:10px;color:var(--muted);margin-top:2px}
.acell .s{font-size:11px;font-weight:800}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.fcell{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}
.fcell .g{font-size:26px;color:var(--txt)}
.fcell .l{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}

/* Arabizi */
.ztab{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-bottom:8px}
.ztab .num{font-size:24px;font-weight:900;color:var(--accent);width:32px;text-align:center}
.ztab .g{font-size:26px;color:var(--txt);width:34px;text-align:center}
.ztab .d{flex:1;min-width:0;font-size:13px}
.ztab .d b{font-size:14px}
.ztab .d small{color:var(--muted);display:block}

.big{text-align:center;padding:12px 0}
.big .em{font-size:50px}
.big .score{font-size:40px;font-weight:900;margin:4px 0}
.big .lab{color:var(--muted)}

/* Parcours */
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dcell{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
.dcell .dn{font-size:15px;font-weight:800}
.dcell .dl{font-size:9px;color:var(--muted);font-weight:700}
.dcell.now{border-color:var(--accent);color:var(--accent)}
.dcell.ok{border-color:#4ec97e55;color:var(--good)}
.dcell.lock{opacity:.38}
.dcell.sel{box-shadow:0 0 0 1.5px var(--accent) inset;background:var(--card)}
.actrow{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:12px 13px;margin-bottom:8px;width:100%;text-align:left}
.actrow.ok{border-color:#4ec97e40;opacity:.72}
.actrow .aic{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
.actrow .abody{flex:1;min-width:0;display:flex;flex-direction:column}
.actrow .at{font-weight:700;font-size:14px;display:block}
.actrow .ad{color:var(--muted);font-size:11px;display:block;unicode-bidi:isolate}
.actrow .atick{font-size:16px;color:var(--accent);flex:0 0 auto}
.actrow.ok .atick{color:var(--good)}
.room2{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.roomb{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--card2);
  border:1px solid var(--line);border-radius:11px;padding:10px 2px;font-size:20px}
.roomb span{font-size:10px;color:var(--muted);font-weight:700}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(12,15,14,.93);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:50}
.nav button{flex:1;color:var(--muted);font-size:9.5px;letter-spacing:-.01em;font-weight:700;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:5px 0;border-radius:11px}
.nav button .ni{font-size:19px;line-height:1}
.nav button.on{color:var(--accent)}

.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;background:var(--bg2);color:var(--muted)}
.pill.warn{background:#d4a24c1f;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);
  padding:11px 17px;border-radius:22px;font-weight:700;font-size:14px;z-index:90;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:5px}
.audiowarn{background:#e5675d14;border:1px solid #e5675d44;border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--txt);margin-bottom:12px}

/* Verbes */
.regle{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px}
.regle .rt{font-size:15px;font-weight:800}
.regle .rk{background:var(--bg2);border:1px dashed var(--accent);border-radius:9px;padding:9px;text-align:center;
  font-weight:800;color:var(--accent);margin:9px 0;font-size:15px}
.regle .rx{font-size:13px;color:var(--muted)}
.regle .rx b{color:var(--txt)}
.vrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-bottom:8px;width:100%;text-align:left}
.vrow .vfr{flex:1;font-size:14.5px;font-weight:700}
.vrow .vb{font-size:13px;color:var(--accent);font-weight:800}
.vrow .vg{font-size:19px;color:var(--muted)}
.conj{display:grid;grid-template-columns:auto 1fr;gap:0}
.conj .cp{padding:9px 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}
.conj .cv{padding:9px 10px;border-bottom:1px solid var(--line);font-weight:800;font-size:15px;color:var(--accent)}

/* Fuṣḥā — l'arabe classique */
.fcard{border-color:#5b9bd555}
.expl.fus{border-color:var(--blue)}
/* isole les mots arabes insérés dans du texte français (bidi) */
.fcard b,.fcard i,.ftab .ar,.fex .ar,.regle .ar,.expl .ar,.ftab b,.ftab i{unicode-bidi:isolate}
.fqbig{font-size:29px;text-align:center;margin:12px 0 8px;line-height:2}
.fex{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.fex .fa{font-size:24px;line-height:1.9;text-align:right}
.fex .ft{color:var(--blue);font-weight:800;font-size:13.5px;margin-top:3px}
.fex .ff{color:var(--muted);font-size:13px}
.fex .fn{color:var(--dim);font-size:12px;margin-top:6px;border-top:1px dashed var(--line);padding-top:6px;line-height:1.5}
.fbridge{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:6px;background:var(--card2);
  border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.fbridge .dz{font-size:14px;font-weight:700;color:var(--muted)}
.fbridge .fz{font-size:21px;text-align:right}
.fbridge .ft{color:var(--blue);font-weight:800;font-size:13px}
.ftab{width:100%;border-collapse:collapse;font-size:13px}
.ftab td{border-bottom:1px solid var(--line);padding:9px 5px;vertical-align:top}
.ftab td.fnum{color:var(--blue);font-weight:900;width:30px}
.ftab td.center{text-align:center}
</style>
</head>
<body>
<div class="top">
  <div class="logo">مفتاح · MIFTAH<small>DARIJA MAROCAINE · DEPUIS ZÉRO</small></div>
  <div class="stats">
    <div class="chip">🔥 <span id="streak">0</span></div>
    <div class="chip"><span class="k">Niv.</span> <span id="hlevel">1</span></div>
  </div>
</div>

<div class="wrap" id="app"></div>

<div class="nav">
  <button data-v="home" class="on"><span class="ni">🧭</span>Parcours</button>
  <button data-v="parler"><span class="ni">💬</span>Parler</button>
  <button data-v="sons"><span class="ni">🔊</span>Sons</button>
  <button data-v="mots"><span class="ni">🃏</span>Mots</button>
  <button data-v="verbes"><span class="ni">⚡</span>Verbes</button>
  <button data-v="ecrire"><span class="ni">✍️</span>Écrire</button>
  <button data-v="fusha"><span class="ni">📜</span>Fuṣḥā</button>
</div>

<div class="toast" id="toast"></div>

<script src="data.js?v=4"></script>
<script src="fusha.js?v=1"></script>
<script src="app.js?v=8"></script>
<script src="fusha-app.js?v=1"></script>
</body>
</html>
